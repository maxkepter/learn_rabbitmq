version: "3.7"

services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ${RABBIT_MQ_PORT}:${RABBIT_MQ_PORT}
      - ${RABBIT_MQ_SERVER}:${RABBIT_MQ_SERVER}
    labels:
      NAME: "rabbitmq"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data:
    driver: local
